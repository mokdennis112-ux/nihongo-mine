<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しい言葉 - 日常日語生字採集庫</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Google Identity Services & GAPI -->
    <script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
    <script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>

    <script>
        if (localStorage.getItem('theme_mode') === 'dark') {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        sakura: {
                            50: '#fff5f7',
                            100: '#ffe3ec',
                            200: '#fccada',
                            400: '#f36890',
                            500: '#e83e6b',
                            600: '#d52150',
                            900: '#4c0819',
                        },
                        japan: {
                            50: '#f4f7f9',
                            100: '#e3e9ef',
                            600: '#2c3e50',
                            800: '#1a252f',
                            900: '#0f171e',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'Noto Sans JP', 'sans-serif'],
                        jp: ['Noto Sans JP', 'Noto Sans TC', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 9999px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); }

        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }

        .sakura-pattern {
            background-image: radial-gradient(circle at 100% 150%, transparent 20%, rgba(232, 62, 107, 0.03) 21%, rgba(232, 62, 107, 0.03) 34%, transparent 35%, transparent),
                              radial-gradient(circle at 0% 150%, transparent 20%, rgba(232, 62, 107, 0.03) 21%, rgba(232, 62, 107, 0.03) 34%, transparent 35%, transparent);
            background-size: 40px 20px;
        }

        input[type="date"] {
            font-family: inherit;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-japan-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-300 sakura-pattern">

    <header class="sticky top-0 z-40 bg-white/90 dark:bg-japan-800/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-700/80">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 gap-2">
                
                <!-- Logo -->
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('add')">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-sakura-500 to-sakura-400 flex items-center justify-center text-white font-black text-xl shadow-lg shadow-sakura-500/25">
                        <i data-lucide="flower-2" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <span class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-sakura-600 to-rose-500 dark:from-sakura-400 dark:to-rose-300 bg-clip-text text-transparent">新しい言葉</span>
                        <p class="text-[10px] text-slate-400 dark:text-slate-400 hidden sm:block">日常日語生字採集庫</p>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="hidden md:flex space-x-1 bg-slate-100 dark:bg-slate-800 p-1.5 rounded-2xl border border-slate-200/60 dark:border-slate-700/50">
                    <button id="nav-add" onclick="switchTab('add')" class="nav-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all flex items-center gap-2 text-slate-600 dark:text-slate-300">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> 新增單詞
                    </button>
                    <button id="nav-gallery" onclick="switchTab('gallery')" class="nav-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all flex items-center gap-2 text-slate-600 dark:text-slate-300">
                        <i data-lucide="library" class="w-4 h-4"></i> 生字卡片庫 (<span id="total-count-nav">0</span>)
                    </button>
                    <button id="nav-cards" onclick="switchTab('cards')" class="nav-btn px-4 py-2 rounded-xl font-bold text-xs sm:text-sm transition-all flex items-center gap-2 text-slate-600 dark:text-slate-300">
                        <i data-lucide="layers" class="w-4 h-4"></i> Flashcards 溫習
                    </button>
                </nav>

                <!-- Actions Right -->
                <div class="flex items-center space-x-2">
                    <button id="sync-btn" onclick="syncToGoogleDrive()" class="px-3.5 py-2 rounded-xl bg-sakura-500 hover:bg-sakura-600 text-white text-xs font-semibold flex items-center gap-1.5 transition-colors shadow-sm">
                        <i data-lucide="cloud-upload" class="w-4 h-4"></i>
                        <span id="sync-btn-text" class="hidden sm:inline">Google Drive 同步</span>
                    </button>
                    
                    <button id="logout-btn" onclick="logoutGoogleAccount()" class="hidden px-3 py-2 rounded-xl border border-rose-200 dark:border-rose-900/50 text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/30 text-xs font-semibold flex items-center gap-1 transition-colors">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                        <span class="hidden sm:inline">登出</span>
                    </button>

                    <button onclick="openBackupModal()" class="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-semibold flex items-center gap-1.5 transition-colors">
                        <i data-lucide="hard-drive" class="w-4 h-4 text-sakura-500"></i>
                        <span class="hidden sm:inline">備份/匯入</span>
                    </button>

                    <button onclick="toggleDarkMode()" class="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
                        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Navigation Bar -->
        <div class="md:hidden flex border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-japan-800 px-2 py-1.5 justify-around text-xs font-semibold">
            <button id="mob-add" onclick="switchTab('add')" class="mob-btn flex flex-col items-center py-1 px-3 text-slate-500">
                <i data-lucide="plus-circle" class="w-5 h-5 mb-0.5"></i> 新增單詞
            </button>
            <button id="mob-gallery" onclick="switchTab('gallery')" class="mob-btn flex flex-col items-center py-1 px-3 text-slate-500">
                <i data-lucide="library" class="w-5 h-5 mb-0.5"></i> 生字卡片庫
            </button>
            <button id="mob-cards" onclick="switchTab('cards')" class="mob-btn flex flex-col items-center py-1 px-3 text-slate-500">
                <i data-lucide="layers" class="w-5 h-5 mb-0.5"></i> Flashcards
            </button>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- ADD TAB -->
        <div id="view-add" class="tab-view space-y-6 max-w-3xl mx-auto">
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-700/80 shadow-xl shadow-slate-200/50 dark:shadow-none space-y-6">
                
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b border-slate-100 dark:border-slate-700/60 pb-4 gap-3">
                    <div class="flex items-center gap-2.5">
                        <div class="p-2 rounded-xl bg-sakura-50 dark:bg-sakura-900/40 text-sakura-500">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">新增日語採集單詞</h2>
                            <p class="text-xs text-slate-400">輸入日常看動漫、日劇或閱讀時採集的生字</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <select id="copy-source-select" onchange="fillFormFromExisting(this.value)" class="px-3 py-1.5 bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none">
                            <option value="">-- 複製現有卡片資料 --</option>
                        </select>
                        <button type="button" onclick="clearForm()" class="text-xs text-slate-400 hover:text-rose-500 font-semibold flex items-center gap-1 shrink-0">
                            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i> 清空
                        </button>
                    </div>
                </div>

                <form id="vocab-form" onsubmit="handleVocabSubmit(event)" class="space-y-5">
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-sakura-500"></span> 1. 採集到的日文單詞 *
                            </label>
                            <input type="text" id="input-word" required oninput="handleWordInput(this.value)" placeholder="例：木漏れ日, 恋愛" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-800 dark:text-slate-100 font-jp font-bold text-lg focus:outline-none focus:ring-2 focus:ring-sakura-500/50 transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-sakura-400"></span> 2. 單詞讀音 / 平假名
                            </label>
                            <input type="text" id="input-reading" placeholder="例：こもれび, れんあい" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-800 dark:text-slate-100 font-jp focus:outline-none focus:ring-2 focus:ring-sakura-500/50 transition-all">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-sakura-500"></span> 詞性 (Part of Speech)
                            </label>
                            <select id="input-pos" onchange="toggleVerbTypeVisibility('input-pos', 'verb-type-container')" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sakura-500/50 transition-all">
                                <option value="">-- 請選擇詞性 --</option>
                                <option value="名詞">名詞</option>
                                <option value="動詞">動詞</option>
                                <option value="形容詞">形容詞 (い形)</option>
                                <option value="形容動詞">形容動詞 (な形)</option>
                            </select>
                        </div>
                        <div id="verb-type-container" class="hidden">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-sakura-400"></span> 動詞分類 (Verb Type)
                            </label>
                            <select id="input-verb-type" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sakura-500/50 transition-all">
                                <option value="">-- 請選擇動詞分類 --</option>
                                <option value="自動詞">自動詞</option>
                                <option value="他動詞">他動詞</option>
                                <option value="自他動詞">自他動詞</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-sakura-500"></span> 3. 中文 / 廣東話釋義 *
                        </label>
                        <input type="text" id="input-definition" required placeholder="例：樹葉縫隙間透出的日光" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sakura-500/50 transition-all">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-sakura-500"></span> 4. 採集日文例句 (Japanese Sentence)
                            </label>
                            <textarea id="input-sentence" rows="2" placeholder="例：木漏れ日がきれいに差し込んでいる。" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-800 dark:text-slate-100 font-jp focus:outline-none focus:ring-2 focus:ring-sakura-500/50 transition-all"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                                <span class="w-2 h-2 rounded-full bg-sakura-400"></span> 5. 例句中文翻譯 (Sentence Translation)
                            </label>
                            <textarea id="input-sentence-tr" rows="2" placeholder="例：樹葉透出的日光美美地照進來。" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sakura-500/50 transition-all"></textarea>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase mb-2 flex items-center gap-1.5">
                            <span class="w-2 h-2 rounded-full bg-sakura-400"></span> 6. 備忘 / 參考連結 (Remarks / URL)
                        </label>
                        <input type="text" id="input-remarks" placeholder="例：https://jisho.org/word/... 或其他參考資料" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sakura-500/50 transition-all">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 pt-2">
                        <div class="space-y-2">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase flex items-center justify-between">
                                <span class="flex items-center gap-1.5"><i data-lucide="music" class="w-4 h-4 text-sakura-500"></i> 單詞音訊 (WORD AUDIO)</span>
                                <span id="word-audio-filename" class="text-[10px] text-slate-400 font-mono">選填</span>
                            </label>
                            <div id="drop-zone-word-audio" class="border-2 border-dashed border-slate-200 dark:border-slate-700 hover:border-sakura-400 bg-slate-50/50 dark:bg-slate-900/50 rounded-2xl p-3 text-center transition-all cursor-pointer">
                                <input type="file" id="file-word-audio" onchange="handleWordAudioUpload(event)" class="hidden">
                                <div id="word-audio-preview-container" class="hidden space-y-2">
                                    <audio id="word-audio-element" controls class="w-full h-8 max-w-full"></audio>
                                    <button type="button" onclick="clearWordAudio(event)" class="text-xs text-rose-500 font-semibold hover:underline flex items-center justify-center gap-1 mx-auto">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 移除
                                    </button>
                                </div>
                                <div id="word-audio-prompt" onclick="document.getElementById('file-word-audio').click()" class="py-2">
                                    <i data-lucide="upload-cloud" class="w-6 h-6 mx-auto text-slate-400 mb-1"></i>
                                    <p class="text-xs font-semibold text-slate-600 dark:text-slate-300">上載或拖放單詞音訊</p>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase flex items-center justify-between">
                                <span class="flex items-center gap-1.5"><i data-lucide="music" class="w-4 h-4 text-sakura-500"></i> 例句音訊 (SENTENCE AUDIO)</span>
                                <span id="audio-filename" class="text-[10px] text-slate-400 font-mono">選填</span>
                            </label>
                            
                            <div id="drop-zone-audio" class="border-2 border-dashed border-slate-200 dark:border-slate-700 hover:border-sakura-400 bg-slate-50/50 dark:bg-slate-900/50 rounded-2xl p-3 text-center transition-all cursor-pointer">
                                <input type="file" id="file-audio" onchange="handleAudioUpload(event)" class="hidden">
                                
                                <div id="audio-preview-container" class="hidden space-y-2">
                                    <audio id="audio-element" controls class="w-full h-8 max-w-full"></audio>
                                    <button type="button" onclick="clearAudio(event)" class="text-xs text-rose-500 font-semibold hover:underline flex items-center justify-center gap-1 mx-auto">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 移除
                                    </button>
                                </div>

                                <div id="audio-prompt" onclick="document.getElementById('file-audio').click()" class="py-2">
                                    <i data-lucide="upload-cloud" class="w-6 h-6 mx-auto text-slate-400 mb-1"></i>
                                    <p class="text-xs font-semibold text-slate-600 dark:text-slate-300">上載或拖放例句音訊</p>
                                </div>
                            </div>
                        </div>

                        <div class="space-y-2">
                            <label class="block text-xs font-bold text-slate-600 dark:text-slate-300 uppercase flex items-center justify-between">
                                <span class="flex items-center gap-1.5"><i data-lucide="image" class="w-4 h-4 text-sakura-500"></i> 參考截圖 (PHOTO)</span>
                                <span id="image-filename" class="text-[10px] text-slate-400 font-mono">選填</span>
                            </label>

                            <div id="drop-zone-image" class="border-2 border-dashed border-slate-200 dark:border-slate-700 hover:border-sakura-400 bg-slate-50/50 dark:bg-slate-900/50 rounded-2xl p-3 text-center transition-all cursor-pointer">
                                <input type="file" id="file-image" accept="image/*" onchange="handleImageUpload(event)" class="hidden">
                                
                                <div id="image-preview-container" class="hidden space-y-2">
                                    <img id="image-element" src="" class="max-h-20 mx-auto rounded-xl shadow-md border border-slate-200 dark:border-slate-700 object-cover">
                                    <button type="button" onclick="clearImage(event)" class="text-xs text-rose-500 font-semibold hover:underline flex items-center justify-center gap-1 mx-auto">
                                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> 移除
                                    </button>
                                </div>

                                <div id="image-prompt" onclick="document.getElementById('file-image').click()" class="py-2">
                                    <i data-lucide="camera" class="w-6 h-6 mx-auto text-slate-400 mb-1"></i>
                                    <p class="text-xs font-semibold text-slate-600 dark:text-slate-300">上載或貼上截圖</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" class="w-full py-4 bg-gradient-to-r from-sakura-500 to-rose-500 hover:from-sakura-600 hover:to-rose-600 text-white font-extrabold text-base rounded-2xl shadow-lg shadow-sakura-500/25 transition-all flex items-center justify-center gap-2">
                            <i data-lucide="check-circle" class="w-5 h-5"></i> 保存卡片
                        </button>
                    </div>

                </form>
            </div>
        </div>

        <!-- GALLERY TAB -->
        <div id="view-gallery" class="tab-view hidden space-y-6">
            <div class="bg-white dark:bg-slate-800 rounded-3xl p-4 sm:p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80 space-y-4">
                <div class="flex flex-col lg:flex-row items-center gap-3">
                    <div class="relative w-full lg:w-1/3">
                        <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                        <input type="text" id="search-input" oninput="renderGallery()" placeholder="搜尋單詞、釋義或例句..." class="w-full pl-12 pr-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl text-xs font-semibold text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sakura-500/50">
                    </div>

                    <div class="flex flex-wrap items-center gap-2 w-full lg:w-2/3 justify-between lg:justify-end">
                        <div class="flex items-center gap-1.5">
                            <i data-lucide="calendar" class="w-4 h-4 text-slate-400"></i>
                            <input type="date" id="filter-date" lang="en-GB" onchange="renderGallery()" class="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 focus:outline-none">
                            <button onclick="document.getElementById('filter-date').value=''; renderGallery();" class="text-[11px] text-slate-400 hover:text-rose-500 font-semibold">清除日曆</button>
                        </div>
